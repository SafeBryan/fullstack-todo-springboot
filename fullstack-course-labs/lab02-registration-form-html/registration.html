<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Form Lab</title>
  </head>
  <body>
    <nav>
      <a href="index.html">Home</a> | <a href="login.html">Login</a> |
      <a href="categories.html">Categories</a>
    </nav>

    <h1>User Registration</h1>

    <form action="#" method="POST">
      <p>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" />
      </p>

      <p>
        <label>Gender:</label><br />

        <input type="radio" id="Male" name="gender" value="Male" />
        <label for="Male">Male</label>

        <input type="radio" id="Female" name="gender" value="Female" />
        <label for="Female">Female</label>
      </p>

      <p>
        <label for="userId">User ID:</label>
        <input type="text" id="userId" name="userId" />
      </p>

      <p>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" />
      </p>

      <p>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" />
      </p>

      <p>
        <label for="address">Address:</label><br />
        <textarea id="address" name="address" rows="5" cols="30"></textarea>
      </p>

      <p>
        <label>Shopping Preferences:</label><br />

        <input
          type="checkbox"
          id="ele"
          name="electronics"
          value="electronics"
        />
        <label for="ele">Electronics</label>

        <input type="checkbox" id="fashion" name="Fashion" value="Fashion" />
        <label for="fashion">Fashion</label>

        <input type="checkbox" id="books" name="Books" value="Books" />
        <label for="books">Books</label>
      </p>

      <p>
        <label for="category">Select Category:</label>
        <select id="category" name="category">
          <option value="Premium">Premium</option>
          <option value="Regular">Regular</option>
        </select>
      </p>

      <p>
        <input type="submit" value="submit" />
      </p>
    </form>

    <footer>
      <p>&copy; All rights reserved</p>
    </footer>
  </body>
</html>
