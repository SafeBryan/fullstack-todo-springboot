<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Lista de productos</title>
    <link rel="stylesheet" href="/css/product-styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Productos disponibles</h1>

      <div class="actions">
        <a href="/add" class="button button-primary">Agregar producto</a>
      </div>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Precio</th>
            <th>Acciones</th>
          </tr>
        </thead>

        <tbody>
          <tr th:each="product : ${products}">
            <td th:text="${product.id}"></td>
            <td th:text="${product.name}"></td>
            <td th:text="${product.description}"></td>
            <td th:text="'$' + ${product.price}"></td>
            <td class="table-actions">
              <a
                th:href="@{/showFormForUpdate/{id}(id=${product.id})}"
                class="button button-secondary"
              >
                Actualizar
              </a>

              <a
                th:href="@{/deleteProduct/{id}(id=${product.id})}"
                class="button button-danger"
                onclick="
                  return confirm('¿Seguro que desea eliminar este producto?');
                "
              >
                Eliminar
              </a>
            </td>
          </tr>
        </tbody>
      </table>
    </main>
  </body>
</html>
