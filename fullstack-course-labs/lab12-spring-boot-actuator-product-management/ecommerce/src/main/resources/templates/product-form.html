<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Formulario de producto</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        margin: 0;
        padding: 30px;
      }

      .container {
        max-width: 600px;
        margin: auto;
        background: white;
        padding: 24px;
        border-radius: 12px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin-top: 0;
        color: #1f2937;
      }

      label {
        display: block;
        margin-top: 14px;
        font-weight: bold;
        color: #374151;
      }

      input,
      textarea {
        width: 100%;
        padding: 10px;
        margin-top: 6px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        box-sizing: border-box;
      }

      button {
        margin-top: 18px;
        padding: 10px 16px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        cursor: pointer;
      }

      a {
        display: inline-block;
        margin-top: 18px;
        color: #2563eb;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Formulario de producto</h1>

      <form
        th:object="${product}"
        th:action="${product.id == null} ? @{/products/add} : @{/products/update/{id}(id=${product.id})}"
        method="post"
      >
        <input type="hidden" th:field="*{id}" />

        <label for="name">Nombre</label>
        <input type="text" id="name" th:field="*{name}" required />

        <label for="price">Precio</label>
        <input
          type="number"
          step="0.01"
          id="price"
          th:field="*{price}"
          required
        />

        <label for="description">Descripción</label>
        <textarea
          id="description"
          th:field="*{description}"
          rows="4"
          required
        ></textarea>

        <button type="submit">Guardar producto</button>
      </form>

      <a th:href="@{/products}">Volver a productos</a>
    </div>
  </body>
</html>
