<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Productos</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        margin: 0;
        padding: 30px;
      }

      .container {
        max-width: 1000px;
        margin: auto;
        background: white;
        padding: 24px;
        border-radius: 12px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin-top: 0;
        color: #1f2937;
      }

      .top-actions {
        margin-bottom: 18px;
      }

      a.button {
        display: inline-block;
        padding: 10px 14px;
        background: #2563eb;
        color: white;
        border-radius: 8px;
        text-decoration: none;
        font-size: 14px;
      }

      a.button.danger {
        background: #dc2626;
      }

      a.button.secondary {
        background: #16a34a;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th {
        background: #111827;
        color: white;
        padding: 12px;
        text-align: left;
      }

      td {
        padding: 12px;
        border-bottom: 1px solid #e5e7eb;
      }

      tr:hover {
        background: #f9fafb;
      }

      .actions {
        display: flex;
        gap: 8px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Productos disponibles</h1>

      <div class="top-actions">
        <a class="button secondary" th:href="@{/products/add}"
          >Añadir producto</a
        >
      </div>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Descripción</th>
            <th>Acciones</th>
          </tr>
        </thead>

        <tbody>
          <tr th:each="product : ${products}">
            <td th:text="${product.id}"></td>
            <td th:text="${product.name}"></td>
            <td th:text="${product.price}"></td>
            <td th:text="${product.description}"></td>
            <td>
              <div class="actions">
                <a
                  class="button"
                  th:href="@{/products/edit/{id}(id=${product.id})}"
                  >Editar</a
                >
                <a
                  class="button danger"
                  th:href="@{/products/delete/{id}(id=${product.id})}"
                  >Eliminar</a
                >
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
