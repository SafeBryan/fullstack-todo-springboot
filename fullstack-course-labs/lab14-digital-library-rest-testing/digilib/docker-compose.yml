services:
  mysql-digilib:
    image: mysql:8.4
    container_name: mysql-digilib
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: library_db
    ports:
      - "3306:3306"
    volumes:
      - digilib_mysql_data:/var/lib/mysql

volumes:
  digilib_mysql_data:
