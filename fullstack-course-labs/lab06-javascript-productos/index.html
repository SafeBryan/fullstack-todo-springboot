<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro de productos</title>

    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page-container">
      <section class="form-card">
        <h1>Registro de producto</h1>

        <p class="description">
          Seleccione una categoría de producto para visualizar dinámicamente la
          imagen correspondiente mediante JavaScript.
        </p>

        <form action="#" method="POST">
          <div class="form-group">
            <label for="productName">Nombre del producto:</label>
            <input
              type="text"
              id="productName"
              name="productName"
              placeholder="Ejemplo: iPhone 15"
            />
          </div>

          <div class="form-group">
            <label for="productCategory">Categoría del producto:</label>

            <select
              id="productCategory"
              name="productCategory"
              onclick="showProductImage()"
            >
              <option value="">Seleccione una categoría</option>
              <option value="phone">Teléfono</option>
              <option value="laptop">Laptop</option>
              <option value="camera">Cámara</option>
              <option value="headphones">Auriculares</option>
              <option value="watch">Reloj inteligente</option>
            </select>

            <div id="productCategoryError" class="error-message"></div>
          </div>

          <div id="productImageSection" class="product-image-section">
            <h2>Imagen del producto</h2>
            <img
              id="productImage"
              src=""
              alt="Imagen del producto seleccionado"
            />
          </div>

          <div class="button-container">
            <button type="button" onclick="validateProductForm()">
              Validar producto
            </button>
            <button type="reset" onclick="resetProductImage()">Limpiar</button>
          </div>

          <p id="resultMessage" class="result-message"></p>
        </form>
      </section>
    </main>
  </body>
</html>
