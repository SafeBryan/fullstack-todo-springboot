<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comentarios - Lista de Compras</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        color: #333333;
        margin: 0;
        padding: 20px;
      }

      nav {
        margin-bottom: 20px;
      }

      nav a {
        color: #0056b3;
        text-decoration: none;
        font-weight: bold;
      }

      nav a:hover {
        text-decoration: underline;
      }

      main {
        max-width: 600px;
        margin: 0 auto;
        background-color: #ffffff;
        padding: 25px;
        border-radius: 10px;
        border: 1px solid #dddddd;
      }

      h1 {
        text-align: center;
        color: #0056b3;
      }

      label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
      }

      input,
      textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #cccccc;
        border-radius: 6px;
        box-sizing: border-box;
      }

      textarea {
        resize: vertical;
      }

      .submit-button {
        background-color: #28a745;
        color: white;
        padding: 12px 20px;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
        width: auto;
      }

      .submit-button:hover {
        background-color: #1e7e34;
      }

      .reset-button {
        background-color: #dc3545;
        color: white;
        padding: 12px 20px;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
        width: auto;
      }

      .reset-button:hover {
        background-color: #8b0000;
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="login.html">Inicio de sesión</a> |
      <a href="categories.html">Categorías</a> |
      <a href="feedback.html">Comentarios</a>
    </nav>

    <main>
      <h1>Formulario de comentarios</h1>

      <form action="#" method="POST">
        <p>
          <label for="nombre">Nombre:</label>
          <input type="text" id="nombre" name="nombre" />
        </p>

        <p>
          <label for="correo">Correo electrónico:</label>
          <input type="email" id="correo" name="correo" />
        </p>

        <p>
          <label for="comentario">Comentario:</label>
          <textarea id="comentario" name="comentario" rows="5"></textarea>
        </p>

        <p>
          <input type="submit" class="submit-button" value="Enviar" />
          <input type="reset" class="reset-button" value="Borrar" />
        </p>
      </form>
    </main>
  </body>
</html>
